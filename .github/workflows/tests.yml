name: Tests

# Every push to main (and every pull request) runs the tests on a clean Windows machine,
# the same way the release build does. Tag a release only once this is green for the commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions page

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true # a newer push replaces a run still in progress

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30 # a hung test stops here, not after GitHub's 6 hours

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements.lock # the exact versions tested locally

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Job logs need a login to read; annotations are public, so the failure shows there too
            $tail = (Get-Content pytest.log -Tail 40 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=Tests failed (exit code $code)::$tail"
            exit $code
          }

      - name: Speed tests
        # A made-up 50,000-file library (tests/test_speed.py): fails if something takes over its budget.
        # The timings are a table on the run's page.
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -m speed -q -s tests/test_speed.py 2>&1 | Tee-Object -FilePath speed.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content speed.log -Tail 40 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=Speed tests failed (exit code $code)::$tail"
            exit $code
          }

      - name: Self-test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "self-test.log"
          python main.py --self-test "$log"
          $code = $LASTEXITCODE
          if (Test-Path $log) { Get-Content $log }
          if ($code -ne 0) {
            $text = (Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=Self-test failed (exit code $code)::$text"
            exit $code
          }
