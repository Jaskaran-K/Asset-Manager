[pytest]
testpaths = tests
pythonpath = .
# A test still running after this long prints every thread's stack (where it's stuck) to the log
faulthandler_timeout = 120
# Speed tests (tests/test_speed.py) run on their own: python -m pytest -m speed
markers =
    speed: a speed test on a made-up 50,000-file library (python -m pytest -m speed)
addopts = -m "not speed"
