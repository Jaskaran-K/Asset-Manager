# The exact versions the tests pass with (Python 3.14, Windows): CI and release builds install
# these (pip install -r requirements-dev.txt -c requirements.lock), so a release never ships a
# version nobody tested. A pip constraints file: it pins what gets installed, adds nothing.
#
# To update: pip install --upgrade -r requirements-dev.txt pyinstaller, run the tests, then
#   python -m pip freeze --exclude pip --exclude setuptools > requirements.lock
# and put this header back. (requirements.txt keeps the ranges the app works with.)
