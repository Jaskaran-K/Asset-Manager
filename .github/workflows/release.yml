name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*' # e.g. v0.2.0 — must match APP_VERSION in core/version.py

permissions:
  contents: write # needed to create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $appVersion = python -c "import sys; sys.path.insert(0, 'core'); import version; print(version.APP_VERSION)"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($appVersion -ne $tagVersion) {
            Write-Error "Tag ${{ github.ref_name }} doesn't match APP_VERSION '$appVersion' in core/version.py. Update one so they match."
            exit 1
          }
          Write-Host "Releasing version $appVersion"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build with PyInstaller (portable exe + folder build)
        run: pyinstaller AssetManager.spec --noconfirm

      - name: Self-test the builds
        shell: pwsh
        run: |
          foreach ($exe in "dist\AssetManager.exe", "dist\AssetManager\AssetManager.exe") {
            $log = Join-Path $env:RUNNER_TEMP "self-test-$([guid]::NewGuid()).log"
            $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$log`"" -Wait -PassThru
            Write-Host "== $exe"; if (Test-Path $log) { Get-Content $log }
            if ($p.ExitCode -ne 0) { Write-Error "$exe self-test failed (exit code $($p.ExitCode)); not publishing."; exit 1 }
          }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          & $iscc "/DAppVersion=$version" installer\AssetManager.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit 1 }

      - name: Test the installer (silent install, then self-test the installed app)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "am-install"
          $p = Start-Process -FilePath "dist\AssetManager-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH", "`"/DIR=$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Installer failed (exit code $($p.ExitCode))"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP "self-test-installed.log"
          $p = Start-Process -FilePath (Join-Path $dir "AssetManager.exe") -ArgumentList "--self-test", "`"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Error "Installed app self-test failed; not publishing."; exit 1 }

      - name: Find release notes
        id: notes
        shell: pwsh
        run: |
          # Hand-written notes in release-notes/<tag>.md are used when present
          $notes = "release-notes/${{ github.ref_name }}.md"
          if (Test-Path $notes) { "path=$notes" >> $env:GITHUB_OUTPUT } else { Write-Host "No $notes; using generated notes only" }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Asset Manager ${{ github.ref_name }}
          files: |
            dist/AssetManager-Setup.exe
            dist/AssetManager.exe
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true # appended below the hand-written notes
